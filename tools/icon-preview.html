<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图标预览</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 36px 48px;
    background: #eef0f5; color: #1c2130;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  h2 { font-size: 13px; font-weight: 650; color: #5b6478; margin: 0 0 12px;
       letter-spacing: .04em; }
  .block { margin-bottom: 30px; }
  .panel { background: #fff; border-radius: 14px; padding: 20px 22px;
           box-shadow: 0 1px 2px rgba(20,26,45,.05), 0 10px 26px -18px rgba(20,26,45,.5); }

  /* 标签栏 */
  .chrome { background: #dee1e6; border-radius: 10px 10px 0 0; padding: 8px 10px 0; display: flex; gap: 4px; }
  .tab { display: flex; align-items: center; gap: 8px; background: #fff;
         border-radius: 8px 8px 0 0; padding: 7px 14px 8px; font-size: 12.5px; color: #3c4043;
         max-width: 220px; }
  .tab.off { background: transparent; color: #5f6368; }
  .tab img { width: 16px; height: 16px; }
  .tab .x { color: #9aa0a6; font-size: 14px; margin-left: 6px; }
  .bar { background: #fff; border-radius: 0 0 10px 10px; padding: 9px 14px; font-size: 12px;
         color: #5f6368; border-top: 1px solid #e6e8f0; }

  /* 任务栏 */
  .taskbar { background: #202124; border-radius: 12px; padding: 12px; display: flex;
             align-items: center; gap: 10px; }
  .tb-item { width: 44px; height: 44px; border-radius: 12px; background: #3c4043;
             display: grid; place-items: center; }
  .tb-item img { width: 32px; height: 32px; }
  .tb-item.active { background: #4a4d51; }
  .tb-item.active::after { content: ""; position: absolute; }
  .tb-line { height: 3px; width: 18px; background: #8ab4f8; border-radius: 2px;
             margin: 4px auto 0; }

  /* 尺寸阶梯 */
  .row { display: flex; align-items: flex-end; gap: 26px; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell span { display: block; font-size: 11px; color: #8b93a7; margin-top: 8px;
               font-variant-numeric: tabular-nums; }
  .pad { display: inline-grid; place-items: center; }

  /* 裁切 */
  .crops { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .crop { text-align: center; font-size: 11px; color: #8b93a7; }
  .crop b { display: block; font-size: 12px; color: #5b6478; font-weight: 600; margin-bottom: 10px; }
  .circle { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; }
  .squircle { width: 96px; height: 96px; border-radius: 26px; overflow: hidden; }
  .tear { width: 96px; height: 96px; border-radius: 50% 50% 50% 12px; overflow: hidden; }
  .plain { width: 96px; height: 96px; }
  .crops img { width: 100%; height: 100%; display: block; }

  .dark { background: #16171d; border-radius: 14px; padding: 20px 22px; }
  .dark h2 { color: #9aa3b8; }
</style>
</head>
<body>

<div class="block">
  <h2>浏览器标签栏</h2>
  <div class="chrome">
    <div class="tab">
      <img src="../web/assets/favicon.ico" alt="">
      <span>wk-switch · 跨项目账户转换</span>
      <span class="x">✕</span>
    </div>
    <div class="tab off"><span>新标签页</span></div>
    <div class="tab off"><span>文档 #2</span></div>
  </div>
  <div class="bar">127.0.0.1:8765</div>
</div>

<div class="block dark">
  <h2>深色任务栏</h2>
  <div class="taskbar">
    <div class="tb-item"><img src="../web/assets/icon-512.png" alt=""></div>
    <div class="tb-item active"><div><img src="../web/assets/icon-512.png" alt=""><div class="tb-line"></div></div></div>
    <div class="tb-item"><img src="../web/assets/icon-512.png" alt=""></div>
  </div>
</div>

<div class="block">
  <h2>尺寸阶梯</h2>
  <div class="panel row">
    <div class="cell"><span class="pad"><img src="../web/assets/favicon.ico" width="16" height="16"></span><span>16</span></div>
    <div class="cell"><span class="pad"><img src="../web/assets/favicon.ico" width="24" height="24"></span><span>24</span></div>
    <div class="cell"><span class="pad"><img src="../web/assets/favicon.ico" width="32" height="32"></span><span>32</span></div>
    <div class="cell"><span class="pad"><img src="../web/assets/favicon.ico" width="48" height="48"></span><span>48</span></div>
    <div class="cell"><span class="pad"><img src="../web/assets/icon-192.png" width="64" height="64"></span><span>64</span></div>
    <div class="cell"><span class="pad"><img src="../web/assets/icon-192.png" width="96" height="96"></span><span>96</span></div>
    <div class="cell"><span class="pad"><img src="../web/assets/icon-192.png" width="128" height="128"></span><span>128</span></div>
    <div class="cell"><span class="pad"><img src="../web/assets/icon-192.png" width="192" height="192"></span><span>192</span></div>
  </div>
</div>

<div class="block">
  <h2>系统裁切（maskable）</h2>
  <div class="panel crops">
    <div class="crop"><b>圆形</b><div class="circle"><img src="../web/assets/icon-maskable-512.png"></div></div>
    <div class="crop"><b>方圆</b><div class="squircle"><img src="../web/assets/icon-maskable-512.png"></div></div>
    <div class="crop"><b>水滴</b><div class="tear"><img src="../web/assets/icon-maskable-512.png"></div></div>
    <div class="crop"><b>原始</b><div class="plain"><img src="../web/assets/icon-512.png"></div></div>
  </div>
</div>

</body>
</html>
