<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · wk-switch</title>
<link rel="icon" href="/static/assets/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="/static/assets/icon.svg">
<link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
<meta name="theme-color" content="#4f46e5">
<style>
  :root {
    --bg: #f5f6fa;
    --ink: #1c2130;
    --ink-2: #5b6478;
    --ink-3: #8b93a7;
    --line: #e6e8f0;
    --brand: #4f46e5;
    --bad: #dc2626;
    --bad-soft: #fdecec;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(1000px 460px at 50% -12%, #e9eaff 0%, rgba(245,246,250,0) 62%),
      var(--bg);
  }
  .wrap { width: 100%; max-width: 372px; }

  .logo {
    display: block;
    width: 46px; height: 46px; margin: 0 auto 14px;
    border-radius: 12px;
    box-shadow: 0 10px 24px -10px rgba(79, 70, 229, .8);
  }
  h1 { margin: 0; text-align: center; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .sub { margin: 5px 0 22px; text-align: center; font-size: 12.5px; color: var(--ink-3); }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(20, 26, 45, .04), 0 18px 40px -24px rgba(20, 26, 45, .28);
    padding: 24px;
  }

  label.field { display: block; margin-bottom: 6px; font-size: 12px; color: var(--ink-2); }

  .input-row { position: relative; }

  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 11px 44px 11px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fcfdff;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: .16s;
  }
  input:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }

  .eye {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    border: 0; background: none; padding: 6px 8px; cursor: pointer;
    color: var(--ink-3); font-size: 12px; border-radius: 7px;
  }
  .eye:hover { background: #f1f3f9; color: var(--ink-2); }

  button.submit {
    width: 100%;
    margin-top: 16px;
    padding: 11px 16px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(180deg, #5b52ea, #4f46e5);
    color: #fff;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 18px -10px rgba(79, 70, 229, .9);
    transition: .16s;
  }
  button.submit:hover { background: linear-gradient(180deg, #4f46e5, #4338ca); }
  button.submit:disabled { opacity: .6; cursor: not-allowed; }

  .err {
    margin-top: 12px;
    padding: 8px 11px;
    border-radius: 8px;
    background: var(--bad-soft);
    color: var(--bad);
    font-size: 12px;
    display: none;
  }
  .err.show { display: block; }

  .foot { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--ink-3); line-height: 1.7; }
  .foot code { font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/static/assets/icon.svg" alt="wk-switch" width="46" height="46">
  <h1>wk-switch</h1>
  <p class="sub">跨项目账户导入导出转换</p>

  <form class="card" id="form" autocomplete="off">
    <label class="field" for="token">访问口令</label>
    <div class="input-row">
      <input type="password" id="token" name="token" placeholder="输入口令后进入" autofocus>
      <button type="button" class="eye" id="eye">显示</button>
    </div>
    <button type="submit" class="submit" id="submit">进入</button>
    <div class="err" id="err"></div>
    <p class="foot">口令在 <code>config/auth.json</code> 的 <code>token</code> 字段里改，改完重启服务生效。</p>
  </form>
</div>

<script>
'use strict';

const form = document.getElementById('form');
const input = document.getElementById('token');
const errBox = document.getElementById('err');
const submit = document.getElementById('submit');
const eye = document.getElementById('eye');

eye.addEventListener('click', () => {
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  eye.textContent = hidden ? '隐藏' : '显示';
  input.focus();
});

function fail(message) {
  errBox.textContent = message;
  errBox.className = 'err show';
  submit.disabled = false;
  submit.textContent = '进入';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = input.value.trim();
  if (!token) {
    fail('先输入口令');
    return;
  }
  submit.disabled = true;
  submit.textContent = '验证中…';
  errBox.className = 'err';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await resp.json().catch(() => ({ ok: false, error: '响应不是 JSON' }));
    if (!resp.ok || data.ok === false) {
      fail(data.error || ('HTTP ' + resp.status));
      return;
    }
    location.replace('/');
  } catch (err) {
    fail('连接失败：' + err.message);
  }
});
</script>
</body>
</html>
